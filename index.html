<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robotic Hand · Live Gesture Mirror</title>
<style>
  :root { --ink:#1a1a1c; --mute:#77756f; --line:rgba(26,26,28,.14); --panel:rgba(255,255,255,.62); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--ink); background:#e9e8e4;
    font-family: "Helvetica Neue", Arial, sans-serif; }
  canvas#stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  .brand { position:fixed; left:calc(28px + env(safe-area-inset-left)); top:calc(24px + env(safe-area-inset-top)); pointer-events:none; }
  .brand b { display:block; font-size:12px; letter-spacing:.34em; font-weight:600; }
  .brand span { display:block; margin-top:6px; font-size:12px; color:var(--mute); letter-spacing:.08em; }

  .tools { position:fixed; right:calc(24px + env(safe-area-inset-right)); top:calc(20px + env(safe-area-inset-top)); display:flex; gap:8px; align-items:flex-start; }
  .tool-items { display:flex; gap:8px; }
  .ghost.icon { display:none; }
  .ghost { appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font:inherit; font-size:12px; padding:8px 14px; border-radius:999px; cursor:pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition:background .15s; }
  .ghost:hover { background:#fff; }
  .ghost[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }

  .dock { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:14px;
    padding:8px 18px 8px 8px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width:calc(100vw - 32px); }
  .primary { appearance:none; border:0; background:var(--ink); color:#fff; font:inherit; font-size:13px; font-weight:500;
    padding:11px 20px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .primary:disabled { opacity:.55; cursor:default; }
  .status { font-size:12.5px; color:var(--mute); display:flex; align-items:center; gap:8px; min-width:0; }
  .status i { width:7px; height:7px; border-radius:50%; background:#b5b3ad; flex:none; }
  .status.live i { background:#2fae62; box-shadow:0 0 0 4px rgba(47,174,98,.18); }
  .status.warn i { background:#d9822b; }
  .status span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .preview { position:fixed; right:24px; bottom:28px; width:220px; aspect-ratio:4/3; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); background:#111; display:none; box-shadow:0 12px 30px rgba(0,0,0,.14); }
  .preview.on { display:block; }
  .preview video, .preview canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  @media (max-width:720px){ .preview{ width:132px; bottom:calc(96px + env(safe-area-inset-bottom)); right:14px; } .brand{ left:calc(16px + env(safe-area-inset-left)); top:calc(18px + env(safe-area-inset-top)); } .tools{ right:calc(12px + env(safe-area-inset-right)); top:calc(12px + env(safe-area-inset-top)); } }
  /* compact layout for phones / narrow windows */
  @media (max-width:600px){
    .brand span{ display:none; }
    .tools{ flex-direction:column; align-items:flex-end; }
    .ghost.icon{ display:block; width:38px; height:38px; padding:0; font-size:18px; line-height:1; }
    .tool-items{ display:none; flex-direction:column; align-items:stretch; gap:6px; }
    .tools.open .tool-items{ display:flex; }
    .tool-items .ghost:not([aria-pressed="true"]){ background:rgba(255,255,255,.88); }
    .tool-items .ghost{ text-align:left; }
    .dock{ gap:10px; padding:6px 14px 6px 6px; border-radius:26px; bottom:calc(16px + env(safe-area-inset-bottom)); width:calc(100vw - 24px); }
    .primary{ padding:11px 16px; }
    .status{ font-size:12px; line-height:1.35; }
    .status span{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div class="brand"><b>ROBOTIC HAND</b><span>Live gesture mirror · Drag to rotate / Scroll to zoom</span></div>

<div class="tools" id="tools">
  <button class="ghost icon" id="btnMenu" aria-label="Menu" aria-expanded="false">&#8943;</button>
  <div class="tool-items">
  <button class="ghost" id="btnFollow" aria-pressed="true" title="Move the robot hand around the screen with your hand">Follow position</button>
  <button class="ghost" id="btnFlip" title="Click if the palm and back of the hand appear swapped">Swap left / right</button>
  <button class="ghost" id="btnReset">Reset view</button>
  </div>
</div>

<div class="preview" id="preview">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div class="dock">
  <button class="primary" id="btnCam">Start camera</button>
  <div class="status" id="status"><i></i><span id="statusText">Demo mode · Start the camera and the robot hand will follow yours</span></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V3 = THREE.Vector3, PI = Math.PI;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ═════════════════════════ renderer / scene ═════════════════════════ */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
/* quality: 0 = full (desktop), 1 = no AO + ≤1.5× pixels (phones / weak GPUs), 2 = 1× pixels + no shadows */
const IS_MOBILE = (() => { const ua = navigator.userAgent || ''; return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); })();
let quality = IS_MOBILE ? 1 : 0;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, quality === 0 ? 2 : 1.5));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e8e4);

/* Studio environment: soft-edged HDR softboxes + black flags, so lacquer gets broad soft highlights
   and black chrome gets crisp bright streaks against dark reflections. */
function softTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  g.shadowColor = '#fff'; g.shadowBlur = 46; g.fillStyle = '#fff';
  g.beginPath(); g.roundRect ? g.roundRect(46, 46, 164, 164, 30) : g.rect(46, 46, 164, 164); g.fill();
  return new THREE.CanvasTexture(c);
}
const SOFT = softTex();
function buildEnv() {
  const s = new THREE.Scene();
  const geo = new THREE.SphereGeometry(80, 64, 32), p = geo.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 80;
    const v = y > 0 ? 0.78 + y * 0.22 : 0.78 + y * 0.55;
    col.push(v, v * 0.995, v * 0.98);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  s.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const box = (w, h, x, y, z, I, soft = true) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(I, I, I), map: soft ? SOFT : null, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  box(46, 34, -34, 40, 30, 14);    // large key softbox, upper-left front
  box(70, 40, 0, 60, 0, 6);        // overhead scrim
  box(12, 60, 52, 6, 18, 11);      // tall strip, right
  box(12, 50, -50, -4, -26, 8);    // tall strip, back left (rim)
  box(40, 14, 10, 24, -55, 9);     // back top rim
  box(60, 10, 0, -14, 58, 3);      // low front bounce
  box(30, 46, -60, 2, 24, 0.02, false);  // black flags
  box(26, 40, 58, -8, -34, 0.02, false);
  box(50, 20, 0, -40, 30, 0.05, false);
  const pm = new THREE.PMREMGenerator(renderer);
  const t = pm.fromScene(s, 0).texture; pm.dispose(); return t;
}
scene.environment = buildEnv();
scene.environmentIntensity = 0.62;

const camera = new THREE.PerspectiveCamera(28, 1, 1, 400);
const CAM_HOME = new V3(0, 0, 52);
camera.position.copy(CAM_HOME);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 25; controls.maxDistance = 280;

const key = new THREE.DirectionalLight(0xfffaf2, 1.35);
key.castShadow = true;
key.shadow.mapSize.set(quality === 0 ? 2048 : 1024, quality === 0 ? 2048 : 1024);
Object.assign(key.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 140 });
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.035; key.shadow.radius = 6;
scene.add(key, key.target);
const KEY_OFF = new V3(-22, 34, 30);

/* post: ambient occlusion for depth in seams and crevices */
let composer = null, gtao = null;
if (quality === 0) try {
  const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  gtao = new GTAOPass(scene, camera, 4, 4);
  gtao.updateGtaoMaterial({ radius: 1.6, distanceExponent: 1.4, thickness: 1.2, scale: 1.15, samples: 16, distanceFallOff: 1 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, rings: 2, samples: 16 });
  gtao.blendIntensity = 0.85;
  composer.addPass(gtao);
  composer.addPass(new OutputPass());
} catch (e) { console.warn('post disabled', e); composer = null; }

/* ═════════════════════════ textures & materials ═════════════════════════ */
function canvasTex(size, draw, srgb) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const rnd = Math.random;
function blobs(g, S, n, rgba, rMin, rMax) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * S, y = rnd() * S, r = rMin + rnd() * (rMax - rMin);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rgba); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
function specks(g, S, n, a, rMax) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = 'rgba(38,32,26,' + (rnd() * a).toFixed(3) + ')';
    g.beginPath(); g.arc(rnd() * S, rnd() * S, 0.35 + rnd() * rMax, 0, 6.3); g.fill();
  }
}
const paintMap = canvasTex(1024, (g, S) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
  blobs(g, S, 40, 'rgba(120,104,84,0.07)', 30, 140);
  specks(g, S, 3800, 0.2, 1.1);
}, true);
const padMap = canvasTex(512, (g, S) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
  blobs(g, S, 20, 'rgba(255,255,255,0.18)', 20, 90);
  specks(g, S, 1400, 0.35, 1.0);
}, true);
const roughMap = canvasTex(512, (g, S) => {
  g.fillStyle = 'rgb(238,238,238)'; g.fillRect(0, 0, S, S);
  blobs(g, S, 50, 'rgba(255,255,255,0.35)', 20, 90);
  blobs(g, S, 50, 'rgba(160,160,160,0.25)', 20, 90);
}, false);
const grain = canvasTex(512, (g, S) => {
  const id = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) { const v = 112 + rnd() * 32; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
}, false);
grain.repeat.set(3, 3);

const M = {
  // satin off-white paint under a clear lacquer coat
  paint: new THREE.MeshPhysicalMaterial({ color: 0xefece5, map: paintMap, roughness: 0.38, roughnessMap: roughMap,
    bumpMap: grain, bumpScale: 0.45, clearcoat: 1, clearcoatRoughness: 0.09 }),
  // smoky grey pads (palm side)
  pad: new THREE.MeshPhysicalMaterial({ color: 0x55524e, map: padMap, roughness: 0.46, roughnessMap: roughMap,
    bumpMap: grain, bumpScale: 0.45, clearcoat: 0.85, clearcoatRoughness: 0.16 }),
  // glossy black chrome
  chrome: new THREE.MeshPhysicalMaterial({ color: 0x4b4b50, metalness: 1, roughness: 0.075, clearcoat: 1, clearcoatRoughness: 0.025 }),
  steel: new THREE.MeshPhysicalMaterial({ color: 0xcdcdd2, metalness: 1, roughness: 0.17 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x131315, roughness: 0.55, metalness: 0.3 }),
  gun: new THREE.MeshPhysicalMaterial({ color: 0x8c8c92, metalness: 1, roughness: 0.26, roughnessMap: roughMap, clearcoat: 0.25, clearcoatRoughness: 0.2 }),
  rubber: new THREE.MeshPhysicalMaterial({ color: 0x1a1a1c, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
};

/* ═════════════════════════ geometry helpers ═════════════════════════ */
/** smooth rounded "pod" along +Y: superellipse cross-section (n=2 ellipse … n→∞ box), rounded ends.
    w/d taper from w0,d0 to w1,d1; zc(t) bends the centreline in Z. */
function pod({ len, w0, w1 = w0, d0, d1 = d0, n = 3, c0 = 0.3, c1 = 0.3, rs = 48, ls = 40, zc = null }) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= ls; i++) {
    const u = i / ls, s = len * (0.5 - 0.5 * Math.cos(PI * u));
    let e = 1;
    if (s < c0) { const q = 1 - s / c0; e = Math.sqrt(Math.max(0, 1 - q * q)); }
    else if (s > len - c1) { const q = (s - (len - c1)) / c1; e = Math.sqrt(Math.max(0, 1 - q * q)); }
    e = Math.max(e, 0.0001);
    const t = s / len, a = (w0 + (w1 - w0) * t) / 2 * e, b = (d0 + (d1 - d0) * t) / 2 * e, z0 = zc ? zc(t) : 0;
    for (let j = 0; j < rs; j++) {
      const th = j / rs * PI * 2, c = Math.cos(th), sn = Math.sin(th);
      pos.push(a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), s, b * Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n) + z0);
      uv.push(Math.abs(j / rs * 2 - 1) * (w0 + w1) * 0.1, t * len * 0.1);
    }
  }
  for (let i = 0; i < ls; i++) for (let j = 0; j < rs; j++) {
    const a = i * rs + j, b = i * rs + (j + 1) % rs, c = a + rs, d = b + rs;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function mesh(geo, mat, p = [0, 0, 0], r = null) { const m = new THREE.Mesh(geo, mat); m.position.set(p[0], p[1], p[2]); if (r) m.rotation.set(r[0], r[1], r[2]); return m; }
function rbox(w, h, d, r, mat) { return new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 6, Math.min(r, w / 2.05, h / 2.05, d / 2.05)), mat); }
function rod(a, b, r, mat) {
  const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 20), mat);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.normalize()); return m;
}
/** turned joint cap: concentric grooves + rolled rim, axis +Y, base at y=0 */
function capGeo(r, h) {
  const P = [[0, 1], [0.18, 1], [0.22, 0.8], [0.34, 0.8], [0.38, 0.96], [0.6, 0.96], [0.64, 0.74], [0.72, 0.74], [0.77, 0.98],
    [0.9, 0.94], [0.97, 0.78], [1, 0.5], [0.99, 0.2], [0.95, 0]];
  return new THREE.LatheGeometry(P.map(([a, b]) => new THREE.Vector2(a * r, b * h)), 56);
}
/** glossy hinge along X with turned caps both sides */
function hinge(w, r) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(r, r, w * 0.88, 48), M.chrome, [0, 0, 0], [0, 0, PI / 2]));
  const h = w * 0.1;
  for (const s of [-1, 1]) {
    g.add(mesh(capGeo(r * 1.04, h), M.chrome, [s * w * 0.43, 0, 0], [0, 0, -s * PI / 2]));
    g.add(mesh(new THREE.TorusGeometry(r * 0.49, r * 0.035, 8, 48), M.steel, [s * (w * 0.43 + h * 0.97), 0, 0], [0, PI / 2, 0]));
  }
  return g;
}
const GEARS = [];
/** involute-ish spur gear outline by module m and tooth count N (pitch radius = m·N/2) */
function gearShape(m, N) {
  const rp = m * N / 2, ro = rp + m * 0.9, rr = rp - m * 1.15, da = PI * 2 / N;
  const s = new THREE.Shape();
  for (let i = 0; i < N; i++) {
    const a0 = i * da;   // tooth i is centred at a0 + 0.41·da
    [[rr, a0], [rr, a0 + da * 0.12], [rp, a0 + da * 0.22], [ro, a0 + da * 0.3], [ro, a0 + da * 0.52], [rp, a0 + da * 0.6], [rr, a0 + da * 0.7]].forEach(([rad, a], k) => {
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad; if (i === 0 && k === 0) s.moveTo(x, y); else s.lineTo(x, y);
    });
  }
  s.closePath();
  const hole = (cx, cy, hr) => { const p = new THREE.Path(); p.absarc(cx, cy, hr, 0, PI * 2, true); s.holes.push(p); };
  hole(0, 0, rr * 0.2);
  if (N >= 12) for (let i = 0; i < 5; i++) { const a = i / 5 * PI * 2 + 0.3; hole(Math.cos(a) * rr * 0.6, Math.sin(a) * rr * 0.6, rr * 0.17); }
  else for (let i = 0; i < 4; i++) { const a = i / 4 * PI * 2 + 0.4; hole(Math.cos(a) * rr * 0.6, Math.sin(a) * rr * 0.6, rr * 0.15); }
  return s;
}
/** machined spur gear, axis = Z. phase: angle the first tooth centre is turned to; k: gear ratio sign/size for driving */
function gear(m, N, th, phase, k) {
  const rp = m * N / 2, rr = rp - m * 1.15;
  const g = new THREE.Group(), spin = new THREE.Group(); g.add(spin);
  const geo = new THREE.ExtrudeGeometry(gearShape(m, N), { depth: th, bevelEnabled: true, bevelThickness: th * 0.12, bevelSize: m * 0.12, bevelSegments: 3, curveSegments: 24 });
  geo.translate(0, 0, -th / 2);
  spin.add(new THREE.Mesh(geo, M.gun));
  spin.add(mesh(new THREE.CylinderGeometry(rr * 0.34, rr * 0.38, th * 1.7, 40), M.chrome, [0, 0, 0], [PI / 2, 0, 0]));
  spin.add(mesh(new THREE.CylinderGeometry(rr * 0.19, rr * 0.19, th * 2.3, 6), M.steel, [0, 0, 0], [PI / 2, 0, 0]));
  spin.add(mesh(new THREE.TorusGeometry(rr * 0.9, m * 0.1, 8, 64), M.steel, [0, 0, th * 0.62]));
  spin.add(mesh(new THREE.TorusGeometry(rr * 0.9, m * 0.1, 8, 64), M.steel, [0, 0, -th * 0.62]));
  spin.rotation.z = phase; spin.userData.k = k;
  GEARS.push(spin);
  return g;
}
/** a meshed pair on the wrist side s: big driver + small driven gear in the same plane (axis = world X) */
function gearPair(s, parent) {
  const m = 0.14, N1 = 16, N2 = 11, rp1 = m * N1 / 2, rp2 = m * N2 / 2, back = 0.015;
  const c1 = new V3(s * 2.15, -1.0, 0.1), d = new V3(0, -0.75, -0.66).normalize();
  const c2 = c1.clone().addScaledVector(d, rp1 + rp2 + back);
  // rotation.y = +90° maps gear-local (x, y) → world (−z, y): direction to the partner in local angles
  const phi1 = Math.atan2(d.y, -d.z), phi2 = phi1 + PI;
  const da1 = PI * 2 / N1, da2 = PI * 2 / N2;
  const g1 = gear(m, N1, 0.42, phi1 - 0.41 * da1, 1);             // tooth centred on the line of centres
  const g2 = gear(m, N2, 0.42, phi2 - 0.91 * da2, -N1 / N2);      // gap centred on it → teeth interleave
  for (const [g, c] of [[g1, c1], [g2, c2]]) { g.rotation.y = PI / 2; g.position.copy(c); parent.add(g); }
  parent.add(rod(new V3(s * 1.7, c2.y, c2.z), new V3(s * 2.15, c2.y, c2.z), 0.12, M.steel));   // axle of the small gear
}
function segment({ len, w, t, tip = false, plate = true, showHinge = true }) {
  const g = new THREE.Group(), r = t * 0.38;
  if (showHinge) g.add(hinge(w, r));
  const y0 = r * 0.8, y1 = tip ? len : len - r * 0.8, L = y1 - y0;

/* ═════════════════════════ landmarks → pose ═════════════════════════ */
let flipPrior = 1, chirBelief = -1, follow = true;

/* Tracking reads a fully straight finger as slightly bent (≈ 8–20°). Soft dead-zone: small bends fade to 0
   smoothly (no snapping), larger bends pass through, rescaled so a full fist still reaches the full angle. */
function straighten(a, b, max) {
  if (a <= 0) return a;
  const r = a < 2 * b ? a * a / (4 * b) : a - b;
  return r * max / (max - b);
}

/* One Euro filter (Casiez et al.): adaptive low-pass. When a point is still or moving slowly it filters

  reset() { this.x = null; }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.dx = 0; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.dx += oeAlpha(dt, this.dCut) * ((x - this.x) / dt - this.dx);
    this.x += oeAlpha(dt, this.minCut + this.beta * Math.abs(this.dx)) * (x - this.x);
    return this.x;
  }
}
/* Pose stabiliser. Filters what you actually see — each joint angle, the palm and thumb orientation, and the

   smoothed angular speed, which camera noise (a few degrees back and forth) barely raises, while a real
   movement (hundreds of degrees per second) does. A tiny dead-band (≈1°) then holds a joint perfectly still
   when only noise is left. */

  reset() { this.q = null; }

    if (!this.q) { this.q = q.clone(); this.v = 0; this.t = t; return this.q; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.v += A_(dt, this.dCut) * (this.q.angleTo(q) / dt - this.v);
    this.q.slerp(q, A_(dt, this.minCut + this.beta * this.v));

const JOINT = () => new OneEuro(0.6, 0.5, 1.0);          // radians: noise ≈ 3–5°, real motion 100–600°/s

  tmcp: JOINT(), tip: JOINT(),
  root: new QuatEuro(0.4, 0.6), thumb: new QuatEuro(0.6, 0.5),
  rootHeld: new THREE.Quaternion(), rootHas: false,
  px: new OneEuro(0.6, 0.25), py: new OneEuro(0.6, 0.25), sc: new OneEuro(0.5, 2.0),   // scene units / scale
  held: new Map(), last: -1e9, chir: 0,

let useFilter = true;
function hold(key, v, db = 0.02) {                     // dead-band: ignore changes smaller than ~1.1°

  STAB.held.set(key, h); return h;
}
function stabilize(now) {

    for (const f of STAB.f) for (const k in f) f[k].x = null;
    for (const k of ['tmcp', 'tip', 'px', 'py', 'sc']) STAB[k].x = null;
    STAB.root.reset(); STAB.thumb.reset(); STAB.held.clear(); STAB.rootHas = false; STAB.chir = target.chir;
  }
  STAB.last = now;
  target.f.forEach((j, i) => { for (const k of ['flex', 'abd', 'pip', 'dip']) j[k] = hold(i + k, STAB.f[i][k].filter(j[k], t)); });

function solve(world, image, label, vAspect, now) {

  // can't tilt the whole hand: across = index→pinky knuckles plus middle→ring; up = wrist → knuckle centre
  const across = P[5].clone().sub(P[17]).add(P[9].clone().sub(P[13]));
  const up = P[5].clone().add(P[9]).add(P[13]).add(P[17]).multiplyScalar(0.25).sub(P[0]);
  const fr = palmFrame(across, up);
  const X = fr.X.clone(), Y = fr.Y.clone(), Z0 = fr.Z0.clone();

  let e = 0;

  if (target.chir * chirBelief < -0.04) target.chir = Math.sign(chirBelief);

    const v1 = bone(ix[0], ix[1]), v2 = bone(ix[1], ix[2]), v3 = bone(ix[2], ix[3]);
    const t = target.f[i];

    t.abd = clamp(-Math.asin(clamp(v1.x, -1, 1)), -0.42, 0.42) * (1 - clamp((t.flex - 0.9) / 0.7, 0, 1) * 0.6);
    const pip = straighten(signedAngle(v1, v2, AX), 0.14, 2.0);

    // so blend the measurement with that coupling to keep the tip responsive and consistent

  thumbQuat(target.tq, t1, h);

  target.tip = clamp(signedAngle(t2, t3, h), -0.35, 1.5);

  const d = (a, b) => Math.hypot((image[a].x - image[b].x) * vAspect, image[a].y - image[b].y);

    target.pos.set((0.5 - cx) * vw * 0.78, (0.5 - cy) * vh * 0.78, 0);
    target.scale = clamp(size / 0.3, 0.6, 1.45);

/* ═════════════════════════ apply (smoothed) ═════════════════════════ */

const curArmDir = new V3(0, 1, 0);
function solveArm(R, F, out) {
  const Yh = new V3(0, 1, 0).applyQuaternion(R), Zh = new V3(0, 0, 1).applyQuaternion(R);
  const y = F.clone().normalize();
  let z = Zh.clone().addScaledVector(y, -Zh.dot(y));
  if (z.lengthSq() < 1e-4) z = new V3(-Yh.x, -Yh.y, -Yh.z).addScaledVector(y, Yh.dot(y));   // palm faces along the arm: use hand dir
  z.normalize();
  out.setFromRotationMatrix(_m2.makeBasis(new V3().crossVectors(y, z), y, z));
  const v = Yh.applyQuaternion(_qi.copy(out).invert());          // hand direction in forearm space
  const flex = Math.atan2(v.z, v.y), dev = Math.asin(clamp(v.x, -1, 1));
  const cf = clamp(flex, -WRIST.extMax, WRIST.flexMax), cd = clamp(dev, -WRIST.dev, WRIST.dev);
  if (cf !== flex || cd !== dev) {
    const vc = new V3(Math.sin(cd), Math.cos(cd) * Math.cos(cf), Math.cos(cd) * Math.sin(cf));
    out.multiply(_qx.setFromUnitVectors(vc, v));                 // forearm turns by whatever the wrist can't bend
  }
  return out;
}
function apply(dt, fast) {
  const k = 1 - Math.exp(-dt * (fast ? 20 : 5)), kp = 1 - Math.exp(-dt * (fast ? 12 : 4));
  if (cur.chir !== target.chir) { cur.chir = target.chir; cur.quat.copy(target.quat); }
  cur.quat.slerp(target.quat, k); cur.pos.lerp(target.pos, kp); cur.scale += (target.scale - cur.scale) * kp;
  cur.tq.slerp(target.tq, k); cur.tmcp += (target.tmcp - cur.tmcp) * k; cur.tip += (target.tip - cur.tip) * k;
  root.quaternion.copy(cur.quat); root.position.copy(cur.pos); root.scale.set(cur.chir * cur.scale, cur.scale, cur.scale);
  fingers.forEach((f, i) => {
    const c = cur.f[i], t = target.f[i];
    for (const kk of ['flex', 'abd', 'pip', 'dip']) c[kk] += (t[kk] - c[kk]) * k;
    f.mcp.rotation.set(c.flex, 0, c.abd); f.pip.rotation.x = c.pip; f.dip.rotation.x = c.dip;
  });
  thumb.base.quaternion.copy(cur.tq); thumb.mcp.rotation.x = cur.tmcp; thumb.ip.rotation.x = cur.tip;
  // forearm
  const desired = target.armFollow ? new V3(0, 1, 0).applyQuaternion(cur.quat) : target.armDir;
  curArmDir.lerp(desired, 1 - Math.exp(-dt * (fast ? 10 : 5))).normalize();
  solveArm(cur.quat, curArmDir, armQ);
  arm.quaternion.copy(armQ);
  arm.position.copy(root.position).add(new V3(0, (hand.position.y + WRIST_PIVOT) * cur.scale, 0).applyQuaternion(cur.quat));
  arm.scale.copy(root.scale);
  key.target.position.copy(root.position); key.position.copy(root.position).add(KEY_OFF);
}

/* Gears are driven by the hand, like a real gearbox: wrist flexion turns them, finger/thumb
   curl pulls the tendons through them. No motion → no rotation. Small gear meshes the big one
   (opposite direction, faster by the tooth ratio). */
const _pq = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _qw = new THREE.Quaternion();
let _pf = null, _pc = cur.chir;
function curlSum() { let f = cur.tmcp + cur.tip; cur.f.forEach(c => { f += c.flex + c.pip + c.dip; }); return f; }
function driveGears(dt) {
  const f = curlSum();
  const W = _qw.copy(armQ).invert().multiply(cur.quat);          // wrist = hand relative to forearm
  if (_pf === null || _pc !== cur.chir) { _pq.copy(W); _pf = f; _pc = cur.chir; return; }
  _dq.copy(_pq).invert().multiply(W); if (_dq.w < 0) { _dq.x = -_dq.x; _dq.z = -_dq.z; }
  const wrist = 2 * _dq.x + 0.6 * 2 * _dq.z;          // flexion + side bend, in radians (local)
  const T = Math.max(dt, 1e-3);
  // separate deadbands: idle "breathing" sway (fingers < ~0.9 rad/s, wrist < ~0.05 rad/s)
  // and tracking jitter must not turn the gears; deliberate motion does
  const soft = (x, d) => Math.sign(x) * Math.max(0, Math.abs(x) - d);
  const rate = soft(wrist * 2.2 / T, 0.25) + soft((f - _pf) * 0.9 / T, 1.4);
  _pq.copy(W); _pf = f;
  if (rate === 0) return;
  const drive = clamp(rate * dt, -0.6, 0.6);
  GEARS.forEach(g => { g.rotation.z += drive * g.userData.k; });
}

/* ═════════════════════════ camera + MediaPipe ═════════════════════════ */
const video = document.getElementById('video'), overlay = document.getElementById('overlay'), octx = overlay.getContext('2d');
const statusEl = document.getElementById('status'), statusText = document.getElementById('statusText'), btnCam = document.getElementById('btnCam');
const setStatus = (txt, cls = '') => { statusText.textContent = txt; statusEl.className = 'status ' + cls; };
let landmarker = null, poseLm = null, poseLoading = false, stream = null, lastSeen = -1e9, lastVideoTime = -1, fake = null;

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
// when the elbow isn't visible, assume the forearm rises from below the frame, tilted slightly away from the camera
const DEFAULT_ARM = new V3(0, 1, -0.25).normalize();
let poseDir = null, poseSeen = -1e9, poseFrame = 0;
async function loadPose(vision, fileset) {
  if (poseLm || poseLoading) return; poseLoading = true;
  const make = delegate => vision.PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: POSE_MODEL, delegate }, runningMode: 'VIDEO', numPoses: 1,
    minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
  try { poseLm = await make('GPU'); } catch { try { poseLm = await make('CPU'); } catch (e) { console.warn('pose tracking unavailable', e); } }
  poseLoading = false;
}
/* elbow→wrist from body pose, for the arm the tracked hand belongs to; runs every 2nd frame (4th on phones) */
function trackArm(now, handImg) {
  if (!poseLm || quality >= 2 || (poseFrame++ % (IS_MOBILE ? 4 : 2))) return;
  let pr; try { pr = poseLm.detectForVideo(video, now); } catch { return; }
  const pl = pr.landmarks && pr.landmarks[0], pw = pr.worldLandmarks && pr.worldLandmarks[0];
  if (!pl || !pw) return;
  const dl = Math.hypot(pl[15].x - handImg[0].x, pl[15].y - handImg[0].y), dr = Math.hypot(pl[16].x - handImg[0].x, pl[16].y - handImg[0].y);
  const [e, w] = dl < dr ? [13, 15] : [14, 16];
  const el = pl[e], vis = el.visibility == null ? 1 : el.visibility;
  if (Math.min(dl, dr) > 0.12 || vis < 0.65 || el.x < 0.01 || el.x > 0.99 || el.y > 0.99) return;   // elbow out of frame / wrong arm
  const d = new V3(-(pw[w].x - pw[e].x), -(pw[w].y - pw[e].y), -(pw[w].z - pw[e].z) * 0.6);   // mirrored like the hand; depth is noisy
  if (d.lengthSq() < 1e-6) return;
  poseDir = d.normalize(); poseSeen = now;
}

async function startCamera() {
  btnCam.disabled = true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    setStatus('Requesting camera access…');
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: IS_MOBILE ? 640 : 960 }, height: { ideal: IS_MOBILE ? 480 : 720 }, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    document.getElementById('preview').classList.add('on');
    if (!landmarker) {
      setStatus('Loading hand-tracking model (a few seconds the first time)…');
      const vision = await import(MP + '/vision_bundle.mjs');
      const { FilesetResolver, HandLandmarker } = vision;
      const fileset = await FilesetResolver.forVisionTasks(MP + '/wasm');
      const make = delegate => HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numHands: 1,
        minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
      try { landmarker = await make('GPU'); } catch { landmarker = await make('CPU'); }
      loadPose(vision, fileset);   // in the background: hand tracking starts right away, the forearm sharpens once it's ready
    }
    setStatus('Hold your hand up to the camera', 'warn');
    btnCam.textContent = 'Stop camera'; btnCam.disabled = false;
  } catch (err) {
    console.error(err); stopCamera();
    const name = err && err.name;
    const framed = (() => { try { return window.top !== window.self; } catch { return true; } })();
    setStatus(framed && (name === 'NotAllowedError' || err.message === 'nocam') ? 'Camera is unavailable in this preview · Open the page directly in your browser'
      : name === 'NotAllowedError' ? 'Camera access denied · Allow it in the address bar and try again'
      : name === 'NotFoundError' ? 'No camera found'
      : err.message === 'nocam' ? 'Camera not supported here · Open this file directly in Chrome / Safari / Edge'
      : 'Failed to start · Check your connection (the tracking model must download) and try again', 'warn');
  }
}
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
  document.getElementById('preview').classList.remove('on');
  btnCam.textContent = 'Start camera'; btnCam.disabled = false; lastSeen = -1e9;
  setStatus('Demo mode · Start the camera and the robot hand will follow yours');
}
btnCam.onclick = () => stream ? stopCamera() : startCamera();

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawOverlay(lm) {
  const w = overlay.width = video.videoWidth, h = overlay.height = video.videoHeight;
  octx.clearRect(0, 0, w, h); if (!lm) return;
  octx.lineWidth = Math.max(2, w / 240); octx.strokeStyle = 'rgba(255,255,255,.85)'; octx.fillStyle = '#fff';
  octx.beginPath(); for (const [a, b] of BONES) { octx.moveTo(lm[a].x * w, lm[a].y * h); octx.lineTo(lm[b].x * w, lm[b].y * h); } octx.stroke();
  for (const p of lm) { octx.beginPath(); octx.arc(p.x * w, p.y * h, w / 160, 0, 6.3); octx.fill(); }
}
function track(now) {
  if (fake) { solve(fake.world, fake.image, fake.label, 4 / 3, now); target.armFollow = false; target.armDir.copy(fake.armDir || DEFAULT_ARM); lastSeen = now; return; }
  if (!landmarker || !stream || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res; try { res = landmarker.detectForVideo(video, now); } catch (e) { console.warn(e); return; }
  const world = res.worldLandmarks && res.worldLandmarks[0], image = res.landmarks && res.landmarks[0];
  if (world && image) {
    const hs = res.handedness || res.handednesses;
    const hd = hs && hs[0] && hs[0][0] && hs[0][0].categoryName;
    solve(world, image, hd, video.videoWidth / video.videoHeight, now);
    trackArm(now, image);
    target.armFollow = false;
    target.armDir.copy(poseDir && now - poseSeen < 600 ? poseDir : DEFAULT_ARM);
    if (now - lastSeen > 500) setStatus('Tracking · The robot hand is mirroring your movements', 'live');
    lastSeen = now; drawOverlay(image);
  } else { drawOverlay(null); if (now - lastSeen > 500 && statusEl.classList.contains('live')) setStatus('Hold your hand up to the camera', 'warn'); }
}

/* ═════════════════════════ UI ═════════════════════════ */
const toolsEl = document.getElementById('tools'), btnMenu = document.getElementById('btnMenu');
btnMenu.onclick = () => { const o = toolsEl.classList.toggle('open'); btnMenu.setAttribute('aria-expanded', o); };
toolsEl.querySelectorAll('.tool-items .ghost').forEach(b => b.addEventListener('click', () => { toolsEl.classList.remove('open'); btnMenu.setAttribute('aria-expanded', false); }));
const btnFollow = document.getElementById('btnFollow');
btnFollow.onclick = () => { follow = !follow; btnFollow.setAttribute('aria-pressed', follow); };
document.getElementById('btnFlip').onclick = () => { flipPrior *= -1; chirBelief *= -1; };
document.getElementById('btnReset').onclick = () => { camera.position.copy(CAM_HOME); controls.target.set(0, 0, 0); controls.update(); };

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // keep ~34 units of the scene visible across the screen: on portrait phones pull the camera back
  // instead of widening the lens, so the whole hand fits without fish-eye distortion
  camera.fov = 28;
  const dist = Math.max(52, 34 / (2 * Math.tan(14 * PI / 180) * camera.aspect));
  if (Math.abs(dist - CAM_HOME.z) > 0.01) {
    const d = camera.position.clone().sub(controls.target);
    d.setLength(d.length() * dist / CAM_HOME.z); camera.position.copy(controls.target).add(d);
    CAM_HOME.z = dist;
  }
  camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
}
window.addEventListener('resize', resize);
function applyQuality() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, quality === 0 ? 2 : quality === 1 ? 1.5 : 1));
  if (quality >= 1 && composer) { try { composer.dispose(); } catch {} composer = null; gtao = null; }
  const sm = quality === 0 ? 2048 : 1024;
  if (key.shadow.mapSize.x !== sm) { key.shadow.mapSize.set(sm, sm); if (key.shadow.map) { key.shadow.map.dispose(); key.shadow.map = null; } }
  key.castShadow = quality < 2;
  resize();
}
applyQuality();
/* frame-rate guard: if the page runs below ~27 fps for two 2-second windows in a row, drop one quality level.
   Never triggers on hardware that keeps up, and only ever steps down (no flip-flopping). */
let fpsWarm = 0, fpsT = 0, fpsN = 0, slowWins = 0;
function fpsGuard(raw) {
  if (quality >= 2 || document.hidden || raw > 0.25) return;   // ignore background tabs and one-off stalls (model loading)
  fpsWarm += raw; if (fpsWarm < 3) return;
  fpsT += raw; fpsN++;
  if (fpsT < 2) return;
  const fps = fpsN / fpsT; fpsT = 0; fpsN = 0;
  slowWins = fps < 27 ? slowWins + 1 : 0;
  if (slowWins >= 2) { quality++; slowWins = 0; fpsWarm = 0; applyQuality(); }
}

/* ═════════════════════════ loop ═════════════════════════ */
idlePose(0); apply(1, true);
let prev = performance.now();
function frame(now) {
  const raw = (now - prev) / 1000, dt = Math.min(0.05, raw); prev = now;
  fpsGuard(raw);
  track(now);
  const tracking = now - lastSeen < 450;
  if (!tracking) idlePose(now / 1000);
  apply(dt, tracking);
  driveGears(dt);
  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__hand = { THREE, scene, camera, controls, renderer, M, key, target, setFake: v => { fake = v; }, get quality() { return quality; }, setFilter: v => { useFilter = v; }, solve, arm, armQ, cur, GEARS, get post() { return !!composer; } };
</script>
